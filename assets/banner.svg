<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: url(#title-grad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Dynamic Animations */
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.05); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.3; }
    }
    @keyframes float-orb {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
      100% { transform: translateY(0px); }
    }
    @keyframes wave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    .orb-1 { animation: pulse 8s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: float-orb 6s ease-in-out infinite; transform-origin: center; }
    .wave-line { stroke-dasharray: 10 15; animation: wave 20s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)" />

  <!-- Animated Background Orbs -->
  <g opacity="0.4">
    <circle class="orb-1" cx="150" cy="80" r="180" fill="url(#accent-glow)" />
    <circle class="orb-2" cx="1050" cy="280" r="220" fill="url(#accent-glow)" />
  </g>

  <!-- Grid / Waves Graphic Accent -->
  <path class="wave-line" d="M -50 300 Q 300 200 600 280 T 1250 200" fill="none" stroke="#4f46e5" stroke-width="2" opacity="0.3"/>
  <path class="wave-line" d="M -50 320 Q 350 240 650 300 T 1250 230" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.25"/>

  <!-- Card Frame Decorator -->
  <rect x="30" y="30" width="1140" height="300" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Foreground Content -->
  <g transform="translate(70, 90)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="230" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#10b981"/>
      <text x="32" y="21" class="badge-text">ENTERPRISE VIDEO PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" class="title">Awesome Enterprise Video Platform</text>

    <!-- Subtitle -->
    <text x="0" y="145" class="subtitle">A curated index of Enterprise Video CMS, Live Streaming &amp; Media Servers</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="140" height="30" rx="8" fill="#334155" opacity="0.8"/>
      <text x="16" y="20" class="badge-text">SaaS &amp; Hosted</text>

      <rect x="152" y="0" width="160" height="30" rx="8" fill="#334155" opacity="0.8"/>
      <text x="168" y="20" class="badge-text">Open-Source FOSS</text>

      <rect x="324" y="0" width="175" height="30" rx="8" fill="#334155" opacity="0.8"/>
      <text x="340" y="20" class="badge-text">Real-Time Streaming</text>
    </g>
  </g>
</svg>
